name: Release on tag

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish BlazorServer
        run: dotnet publish BlazorServer/BlazorServer.csproj --configuration Release --output artifacts/BlazorServer

      - name: Publish HeadlessServer
        run: dotnet publish HeadlessServer/HeadlessServer.csproj --configuration Release --output artifacts/HeadlessServer

      - name: Include Json data
        shell: pwsh
        run: |
          Copy-Item -Path Json -Destination artifacts/BlazorServer/Json -Recurse -Force
          Copy-Item -Path Json -Destination artifacts/HeadlessServer/Json -Recurse -Force

      - name: Write default data_config
        shell: pwsh
        run: |
          $defaultDataConfig = @{ Version = 14; Root = ".\\Json" } | ConvertTo-Json -Compress
          Set-Content artifacts/BlazorServer/data_config.json $defaultDataConfig
          Set-Content artifacts/HeadlessServer/data_config.json $defaultDataConfig

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path artifacts/BlazorServer/* -DestinationPath "artifacts/BlazorServer-$tag.zip"
          Compress-Archive -Path artifacts/HeadlessServer/* -DestinationPath "artifacts/HeadlessServer-$tag.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/BlazorServer-*.zip
            artifacts/HeadlessServer-*.zip
